<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
JGA Admin - Jonathan
</title>


<meta name="theme-color" content="#ff9800">


<link rel="stylesheet" href="style.css">


<style>


body{

padding-bottom:30px;

}



.admin-container{

padding:20px;

max-width:700px;

margin:auto;

}



.login-box,
.admin-panel{

background:
rgba(255,255,255,.08);

backdrop-filter:
blur(15px);

border-radius:25px;

padding:25px;

margin-top:30px;

}



input{

width:100%;

padding:15px;

border-radius:15px;

border:none;

margin:10px 0;

font-size:18px;

}



.admin-button{

width:100%;

padding:15px;

border-radius:20px;

border:none;

background:#ff9800;

color:white;

font-size:18px;

margin-top:10px;

}



.player-admin{

background:
rgba(255,255,255,.08);

border-radius:20px;

padding:15px;

margin-bottom:15px;

}



.admin-row{

display:flex;

justify-content:space-between;

align-items:center;

margin-top:10px;

}



.admin-row button{

width:45px;

height:45px;

border-radius:50%;

border:none;

font-size:25px;

background:#ff9800;

color:white;

}



.value{

font-size:25px;

font-weight:bold;

width:60px;

text-align:center;

}



.danger{

background:#d32f2f;

}



.success{

background:#4caf50;

}

.back-button{

    background:#333;

    border:1px solid rgba(255,255,255,.2);

}


</style>


</head>


<body>


<header class="hero">

<div class="beer-animation">
🔒
</div>


<h1>
Jonathan's<br>
Admin Bereich
</h1>


</header>





<div class="admin-container">



<div id="loginBox" class="login-box">


<h2>
Admin Passwort
</h2>


<input

id="password"

type="password"

placeholder="Passwort eingeben"


>


<button

class="admin-button"

onclick="login()"

>

Einloggen

</button>



</div>








<div id="adminPanel" class="admin-panel" style="display:none">


<h2>
Statistik bearbeiten
</h2>

<button
class="admin-button back-button"
onclick="goBack()"
>

⬅️ Zurück zum Spiel

</button>

<div id="players"></div>



<button

class="admin-button success"

onclick="saveChanges()"

>

💾 Speichern

</button>



<button

class="admin-button danger"

onclick="resetGame()"

>

🔥 Alles zurücksetzen

</button>



<button

class="admin-button"

onclick="exportData()"

>

📤 Exportieren

</button>



<label class="admin-button" style="display:block;text-align:center">


📥 Importieren

<input

type="file"

id="importFile"

accept=".json"

onchange="importData(event)"

style="display:none"

>


</label>




</div>



</div>





<script src="admin.js"></script>


</body>

</html>
